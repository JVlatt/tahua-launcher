<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/styles.css" />
    <title>Tahua Launcher</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <header class="top">
      <div class="brand">
        <h1>Tahua Launcher</h1>
        <p class="subtitle">Plugins FFGL pour Resolume</p>
      </div>
      <div class="actions">
        <button id="refresh" class="ghost" type="button">Rafraîchir</button>
        <button id="update-all" type="button">Tout mettre à jour</button>
      </div>
    </header>

    <div id="launcher-update" class="banner info" hidden></div>
    <div id="running" class="banner warning" hidden></div>
    <div id="error" class="banner error" hidden></div>

    <section class="targets">
      <span class="label">Installer dans</span>
      <div id="targets"></div>
    </section>

    <main id="plugins" aria-live="polite">
      <p class="empty">Chargement du catalogue…</p>
    </main>

    <footer>
      <span id="footer-info"></span>
      <span>Redémarrez Resolume pour charger les changements.</span>
    </footer>
  </body>
</html>
